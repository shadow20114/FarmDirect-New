<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register — FarmDirect</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-7 shadow-2xl">
<h1 class="text-2xl font-bold text-emerald-400 text-center">🌾 FarmDirect</h1>
<p class="text-center text-slate-400 text-sm mt-2">Create your account</p>
<form id="registerForm" class="space-y-4 mt-6">
<div>
<label class="text-xs text-slate-400">Name</label>
<input id="name" type="text" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3">
</div>
<div>
<label class="text-xs text-slate-400">Phone</label>
<input id="phone" type="text" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3">
</div>
<div>
<label class="text-xs text-slate-400">Password</label>
<input id="password" type="password" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3">
</div>
<div>
<label class="text-xs text-slate-400">Role</label>
<select id="role" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3">
<option value="FARMER">Farmer</option>
<option value="BUYER">Buyer</option>
<option value="FPO">FPO</option>
</select>
</div>
<div>
<label class="text-xs text-slate-400">Location</label>
<input id="location" type="text" placeholder="Hyderabad" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3">
</div>
<div>
<label class="text-xs text-slate-400">Preferred Language</label>
<select id="language" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3">
<option value="English">English</option>
<option value="Telugu">తెలుగు (Telugu)</option>
<option value="Hindi">हिंदी (Hindi)</option>
<option value="Marathi">मराठी (Marathi)</option>
<option value="Punjabi">ਪੰਜਾਬੀ (Punjabi)</option>
</select>
</div>
<button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-lg">REGISTER</button>
</form>
<p id="message" class="text-center text-sm mt-4"></p>
<p class="text-center text-xs text-slate-400 mt-5">Already registered? <a href="login.html" class="text-emerald-400">Login</a></p>
<p class="text-center text-xs mt-4"><a href="index.html" class="text-slate-400">← Home</a></p>
</div>
<script src="auth.js"></script>
</body>
</html>
